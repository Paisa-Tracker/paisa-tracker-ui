</head>
<body>
  <app-root></app-root>
  <script>
        // Simple Micro-interactions
        document.querySelectorAll('article, section, button').forEach(el => {
            el.addEventListener('mousedown', () => {
                el.classList.add('scale-95');
            });
            el.addEventListener('mouseup', () => {
                el.classList.remove('scale-95');
            });
            el.addEventListener('mouseleave', () => {
                el.classList.remove('scale-95');
            });
        });
    </script>
    <script>
  // Micro-interaction for the password visibility toggle
  const toggleBtn = document.querySelector('button[type="button"]');
  const passwordInput = document.getElementById('password');
  const visibilityIcon = toggleBtn ? toggleBtn.querySelector('.material-symbols-outlined') : null;

  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Simple button active state visual feedback refinement
  const buttons = document.querySelectorAll('button');
  buttons.forEach(btn => {
    btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
    btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
    btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
  });
</script>
